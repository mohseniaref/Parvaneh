[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=0.29", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "parvaneh"
version = "0.1.0a1"
description = "Reproducible accelerated algorithms for phase unwrapping"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [{name = "Mohammad Mohseni Aref", email = "mohseni.aref@gmail.com"}]
keywords = ["phase unwrapping", "interferometry", "Numba", "Cython", "CuPy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.4"]

[project.urls]
Homepage = "https://github.com/mohseniaref/Parvaneh"
Repository = "https://github.com/mohseniaref/Parvaneh.git"

[project.scripts]
parvaneh = "parvaneh.cli:main"

[project.optional-dependencies]
numba = ["numba>=0.55"]
geo = ["rasterio>=1.2"]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The import package lives under src/, so setuptools must look there for it and
# install it at the top level (`parvaneh`, not `src.parvaneh`).
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
